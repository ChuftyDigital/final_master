# Super Factory Ultimate - Master Configuration
# Optimized for: RunPod + NVIDIA RTX 5090 (Blackwell, 32GB GDDR7)
# Override via CLI flags or environment variables.

project:
  name: "Super Factory Ultimate"
  version: "2.0.0"
  base_dir: "."  # auto-detected at runtime

comfyui:
  server: "127.0.0.1:8188"
  protocol: "http"       # RunPod internal: http. RunPod proxy: https
  timeout: 300            # seconds per image
  verify_ssl: false       # false for RunPod HTTPS proxies
  max_retries: 3
  retry_delay: 5

# RTX 5090 Blackwell optimizations
gpu:
  name: "NVIDIA RTX 5090"
  vram: 32                # GB GDDR7
  architecture: "Blackwell (sm_120)"
  cuda_version: "12.8"
  pytorch: "nightly-cu128"
  # 5090-specific flags
  disable_xformers: true  # incompatible with Blackwell
  disable_sage_attention: true  # causes errors on 5090
  fp8_enabled: true       # 2x speedup on Blackwell
  memory_config: "max_split_size_mb:512"

generation:
  # Reference images (Z-Image Base, quality focus)
  # Z-Image Base: ~28 steps, CFG 1.0, dpmpp_2m sampler, simple scheduler
  reference:
    count_per_character: 3
    poses: ["front", "angle", "natural"]
    resolution: [1024, 1024]
    steps: 28
    cfg: 1.0
    sampler: "dpmpp_2m"
    scheduler: "simple"

  # Bulk content (Z-Image Turbo, speed focus)
  # Z-Image Turbo: 8 steps, CFG 1.0, NO negative prompts, natural sentences
  # RTX 5090: ~10-12s per image vs ~15-20s on 4090
  bulk:
    resolution: [1024, 1536]  # portrait orientation
    steps: 8
    cfg: 1.0
    sampler: "dpmpp_2m"
    scheduler: "simple"

  # All 4 content lanes active
  lanes:
    sfw:
      name: "Safe For Work"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }
    suggestive:
      name: "Suggestive"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }
    spicy:
      name: "Spicy"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }
    nsfw:
      name: "NSFW"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }

models:
  # Checkpoint for reference generation (quality focus)
  reference_checkpoint: "z_image_bf16.safetensors"
  # Checkpoint for bulk generation (speed focus)
  bulk_checkpoint: "z_image_turbo_bf16.safetensors"
  # VAE (shared between all Z-Image models)
  vae: "ae.safetensors"
  # Z-Image text encoder (Qwen 3.4B for Lumina2 architecture, loaded via CLIPLoader)
  text_encoder: "qwen_3_4b_fp8_mixed.safetensors"
  # Upscaler
  upscaler: "4x-ClearRealityV1.pth"

# RunPod workspace paths
paths:
  personas: "personas"
  templates: "templates"
  workflows: "workflows"
  reference_images: "input/reference_images"
  output: "output"
  logs: "logs"

runpod:
  container_image: "nvcr.io/nvidia/pytorch:25.01-py3"
  container_disk: 50     # GB
  volume_size: 100       # GB persistent storage
  comfyui_path: "/workspace/runpod-slim/ComfyUI"
  project_path: "/workspace/superfactory"
  ports:
    comfyui: 8188
    ssh: 22

logging:
  level: "INFO"
  file: "logs/superfactory.log"
  console: true
