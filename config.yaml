# Super Factory Ultimate - Master Configuration
# Pipeline: FLUX.1 Dev (FP8) on RunPod + NVIDIA RTX 5090 (Blackwell, 32GB GDDR7)
# Override via CLI flags or environment variables.

project:
  name: "Super Factory Ultimate"
  version: "3.0.0"
  base_dir: "."  # auto-detected at runtime

comfyui:
  server: "127.0.0.1:8188"
  protocol: "http"       # RunPod internal: http. RunPod proxy: https
  timeout: 300            # seconds per image
  verify_ssl: false       # false for RunPod HTTPS proxies
  max_retries: 3
  retry_delay: 5

# RTX 5090 Blackwell optimizations
gpu:
  name: "NVIDIA RTX 5090"
  vram: 32                # GB GDDR7
  architecture: "Blackwell (sm_120)"
  cuda_version: "12.8"
  pytorch: "nightly-cu128"
  # 5090-specific flags
  disable_xformers: true  # incompatible with Blackwell
  disable_sage_attention: true  # causes errors on 5090
  fp8_enabled: true       # 2x speedup on Blackwell with FP8 model
  memory_config: "max_split_size_mb:512"

generation:
  # Reference images (FLUX.1 Dev, full photorealistic pipeline)
  # Pipeline: FluxPromptEnhance → KSampler → FaceDetailer → 4x-UltraSharp
  # Sampler: dpmpp_2m_sde_gpu + karras (best for photorealism)
  # ~60-90 seconds per image on RTX 5090 with FP8
  reference:
    count_per_character: 3
    poses: ["front", "angle", "natural"]
    resolution: [1024, 1024]
    steps: 28
    cfg: 1.0
    sampler: "dpmpp_2m_sde_gpu"
    scheduler: "karras"
    face_detail: true
    face_detail_denoise: 0.35
    upscale: true
    upscale_model: "4x-UltraSharp.pth"
    upscale_megapixels: 4.0

  # Bulk content (same pipeline, FaceDetailer on, upscale off for speed)
  # RTX 5090 FP8: ~45-60s per image at 1024x1536
  bulk:
    resolution: [1024, 1536]  # portrait orientation
    steps: 28
    cfg: 1.0
    sampler: "dpmpp_2m_sde_gpu"
    scheduler: "karras"
    face_detail: true
    face_detail_denoise: 0.35
    upscale: false

  # All 4 content lanes active
  lanes:
    sfw:
      name: "Safe For Work"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }
    suggestive:
      name: "Suggestive"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }
    spicy:
      name: "Spicy"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }
    nsfw:
      name: "NSFW"
      images_per_character: 200
      bundles: { one_off: 80, "3x": 10, "5x": 10, "10x": 4 }

models:
  # FLUX.1 Dev FP8 — primary model for all generation
  reference_checkpoint: "flux1-dev-fp8.safetensors"
  bulk_checkpoint: "flux1-dev-fp8.safetensors"
  # VAE (shared, same ae.safetensors works for FLUX)
  vae: "ae.safetensors"
  # FLUX text encoders (DualCLIPLoader: T5-XXL + CLIP-L)
  text_encoder_t5: "t5xxl_fp8_e4m3fn.safetensors"
  text_encoder_clip: "clip_l.safetensors"
  clip_type: "flux"
  # Upscaler
  upscaler: "4x-ClearRealityV1.pth"

# RunPod workspace paths
paths:
  personas: "personas"
  templates: "templates"
  workflows: "workflows"
  reference_images: "input/reference_images"
  output: "output"
  logs: "logs"

runpod:
  container_image: "nvcr.io/nvidia/pytorch:25.01-py3"
  container_disk: 50     # GB
  volume_size: 100       # GB persistent storage
  comfyui_path: "/workspace/runpod-slim/ComfyUI"
  project_path: "/workspace/superfactory"
  ports:
    comfyui: 8188
    ssh: 22

logging:
  level: "INFO"
  file: "logs/superfactory.log"
  console: true
